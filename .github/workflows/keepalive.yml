-- =====================================================
-- gas_keepalive: ตารางเล็ก 1 แถว ให้ keepalive "เขียน" จริงทุกวัน
-- รันใน Supabase Dashboard > SQL Editor (รันทีเดียวทั้งก้อนได้)
-- =====================================================
CREATE TABLE IF NOT EXISTS public.gas_keepalive (
  id        INT PRIMARY KEY,
  pinged_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

INSERT INTO public.gas_keepalive (id) VALUES (1) ON CONFLICT (id) DO NOTHING;

ALTER TABLE public.gas_keepalive ENABLE ROW LEVEL SECURITY;

DROP POLICY IF EXISTS keepalive_select ON public.gas_keepalive;
CREATE POLICY keepalive_select ON public.gas_keepalive
  FOR SELECT TO anon, authenticated USING (id = 1);

DROP POLICY IF EXISTS keepalive_update ON public.gas_keepalive;
CREATE POLICY keepalive_update ON public.gas_keepalive
  FOR UPDATE TO anon, authenticated USING (id = 1) WITH CHECK (id = 1);

-- สิทธิ์ (ต้องระบุเอง ตามกฎใหม่ของ Supabase) — anon แก้ได้เฉพาะแถว id=1 เท่านั้น
GRANT SELECT, UPDATE ON public.gas_keepalive TO anon, authenticated;
GRANT ALL ON public.gas_keepalive TO service_role;
