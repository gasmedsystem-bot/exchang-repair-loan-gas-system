name: Supabase Keepalive

on:
  schedule:
    - cron: '17 2 * * *'     # ทุกวัน 02:17 UTC (09:17 น. ไทย)
  workflow_dispatch:          # กดรันเองได้จากแท็บ Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read + Write ping
        env:
          SUPA_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttdGV1eHB2cGNxY2hhY3BlZm15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNTgwMDUsImV4cCI6MjA5NjkzNDAwNX0.HpVuvxq9Nx1flqWYzOuQ5_iB6I7DeBN_YxgfzIERvDc
        run: |
          base="https://kmteuxpvpcqchacpefmy.supabase.co/rest/v1"
          echo "key length: ${#SUPA_ANON}"

          # 1) อ่านตารางหลัก
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$base/exchang-repair-loan-gas-system?limit=1&select=id" \
            -H "apikey: $SUPA_ANON" -H "Authorization: Bearer $SUPA_ANON")
          echo "READ  HTTP $code"
          [ "$code" = "200" ] || exit 1

          # 2) เขียนจริง: อัปเดตแถวเดียวใน gas_keepalive
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          out=$(curl -s -w "\n%{http_code}" -X PATCH "$base/gas_keepalive?id=eq.1" \
            -H "apikey: $SUPA_ANON" -H "Authorization: Bearer $SUPA_ANON" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"pinged_at\":\"$now\"}")
          code=$(echo "$out" | tail -n1)
          body=$(echo "$out" | sed '$d')
          echo "WRITE HTTP $code body: $body"
          [ "$code" = "200" ] && echo "$body" | grep -q '"id":1'
